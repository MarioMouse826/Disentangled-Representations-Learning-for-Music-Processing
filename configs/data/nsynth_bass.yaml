# NSynth-bass HDF5 cached dataset (pre-computed log-mel spectrograms).
# Requires NSYNTH_CACHE_TRAIN and NSYNTH_CACHE_VALID env vars pointing to
# HDF5 files produced by scripts/prepare_nsynth_cache.py.
#
# Usage:
#   python -m src.training.cli data=nsynth_bass
#   NSYNTH_CACHE_TRAIN=/path/train.h5 NSYNTH_CACHE_VALID=/path/valid.h5 python -m src.training.cli data=nsynth_bass

train_dataset:
  _target_: src.data.nsynth_cached.NSynthBassCached
  h5_path: ${oc.env:NSYNTH_CACHE_TRAIN}

val_dataset:
  _target_: src.data.nsynth_cached.NSynthBassCached
  h5_path: ${oc.env:NSYNTH_CACHE_VALID}

batch_size: 32
num_workers: 4
